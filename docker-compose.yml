# ============================================================================
#  TUPAN — Orquestração local (docker compose)
#  Uso: docker compose up --build          (web em http://localhost:5000)
#       docker compose run --rm core tupan_sim --ur 70 --json
# ============================================================================
services:
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: web
    image: tupan-web:local
    ports:
      - "5000:5000"
    environment:
      PYTHONUNBUFFERED: "1"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:5000/health').status==200 else 1)"]
      interval: 30s
      timeout: 3s
      retries: 3

  core:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: core
    image: tupan-core:local
    profiles: ["cli"]
