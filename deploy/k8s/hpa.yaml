apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: tupan-web
  namespace: tupan
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: tupan-web
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
