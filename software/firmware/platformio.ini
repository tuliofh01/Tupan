; Tupan, Máquina de Chuva — firmware MVC (Arduino Mega 2560)
; Build:  pio run          Upload: pio run -t upload
; Monitor (logs FSM/sensores):  pio device monitor -b 115200
[env:mega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino
build_flags =
    -std=c++20
    -Wall
    -Wextra
    -Os
monitor_speed = 115200
