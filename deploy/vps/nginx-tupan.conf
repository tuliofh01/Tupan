# ============================================================================
#  TUPAN — reverse proxy (nginx) para a VPS
#  Instalar em /etc/nginx/conf.d/tupan.conf e ajustar server_name/TLS.
# ============================================================================
upstream tupan_web {
    server 127.0.0.1:5000;
    keepalive 16;
}

server {
    listen 80;
    server_name tupan.exemplo.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name tupan.exemplo.org;

    ssl_certificate     /etc/letsencrypt/live/tupan.exemplo.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tupan.exemplo.org/privkey.pem;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    location / {
        proxy_pass http://tupan_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /health {
        proxy_pass http://tupan_web;
        access_log off;
    }
}
