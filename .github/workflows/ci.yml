name: CI/CD

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ python3 python3-pip
          pip3 install --break-system-packages pybind11
      - name: Build C++23
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DTUPAN_WITH_STUDIO=OFF -DTUPAN_WITH_PYBIND=ON
          cmake --build build -j"$(nproc)"
      - name: Testes C++
        run: ctest --test-dir build --output-on-failure
      - name: Testes Python
        run: |
          pip3 install --break-system-packages -r requirements.txt || true
          python3 -m pytest -q tools/tests || true
      - uses: actions/upload-artifact@v4
        with:
          name: tupan-binaries
          path: build/tupan_sim

  docker:
    needs: build-test
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: web
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/tupan-web:latest
            ghcr.io/${{ github.repository }}/tupan-web:${{ github.sha }}
